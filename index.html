<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site Unavailable</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Arial Black', Arial, sans-serif;
    padding: 24px;
  }

  .card {
    background: #111;
    border: 3px solid #ff2d2d;
    border-radius: 12px;
    padding: 60px 48px;
    max-width: 720px;
    width: 100%;
    text-align: center;
  }

  .icon {
    font-size: 64px;
    margin-bottom: 24px;
    display: block;
  }

  .headline {
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 900;
    color: #ff2d2d;
    text-transform: uppercase;
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
  }

  .sub {
    font-size: clamp(14px, 2.5vw, 18px);
    color: #888;
    font-family: Arial, sans-serif;
    font-weight: 400;
    line-height: 1.6;
  }

  .badge {
    display: inline-block;
    margin-top: 32px;
    background: #ff2d2d;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="icon">&#9888;</span>
    <h1 class="headline">Developer Has Not<br>Been Paid</h1>
    <p class="sub">This website is currently offline because the outstanding developer invoice has not been settled. Please contact the developer to restore access.</p>
    <span class="badge">Site Suspended</span>
  </div>
</body>
</html>
